<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión – Docu Gestión Documental</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="alternate icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/favicon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="sysdoc-login-body">

  <div class="sysdoc-login-card">
    <div class="login-brand-center">
      <div class="login-brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </div>
      <h1 class="login-title">Docu</h1>
      <p class="login-subtitle">Gestión Documental – Sector Informática<br>Secretaría de Niñez, Adolescencia y Familia</p>
    </div>

    {% if form.errors %}
      <div class="alert-box alert-error" style="margin-bottom: 20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
        <span>Usuario o contraseña incorrectos. Por favor, intente nuevamente.</span>
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-field-group">
        <label class="form-field-label" for="id_username">Usuario</label>
        <div class="input-with-icon">
          <span class="input-icon-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input
            type="text"
            name="username"
            id="id_username"
            class="form-input-styled"
            placeholder="Ingrese su usuario"
            autofocus
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-field-group">
        <label class="form-field-label" for="id_password">Contraseña</label>
        <div class="input-with-icon">
          <span class="input-icon-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input
            type="password"
            name="password"
            id="id_password"
            class="form-input-styled"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 14px;">
        <span>Ingresar al Sistema</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <p style="text-align: center; margin-top: 24px; font-size: 11.5px; color: var(--text-muted);">
      Sistema de uso interno exclusivo para el personal autorizado.
    </p>
  </div>

</body>
</html>
